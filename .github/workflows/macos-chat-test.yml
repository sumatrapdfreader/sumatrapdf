name: macOS ARM64 AI Chat test

on:
  workflow_dispatch:
  push:
    branches: [fix-mac-chat-session-menu]

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Run unit tests
        run: bun cmd/ng-build.ts -mac -dbg test_util -run -- -for-ai
      - name: Build release app
        run: bun cmd/ng-build.ts -mac -rel -rev 1 SumatraPDF
      - name: Package app
        run: |
          lipo out/mac/rel/SumatraPDF.app/Contents/MacOS/SumatraPDF -verify_arch arm64
          codesign --verify --deep --strict out/mac/rel/SumatraPDF.app
          ditto -c -k --sequesterRsrc --keepParent out/mac/rel/SumatraPDF.app SumatraPDF-macOS-arm64-chat-test.zip
          shasum -a 256 SumatraPDF-macOS-arm64-chat-test.zip > SumatraPDF-macOS-arm64-chat-test.zip.sha256
          echo "Built test commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SumatraPDF-macOS-arm64-chat-test
          path: |
            SumatraPDF-macOS-arm64-chat-test.zip
            SumatraPDF-macOS-arm64-chat-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
